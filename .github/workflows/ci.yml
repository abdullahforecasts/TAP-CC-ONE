name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit, property and conformance tests (with coverage)
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Viewer end-to-end tests in Chromium (CSP, vectors, replay)
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @tap/ui exec playwright install --with-deps chromium
          pnpm --filter @tap/ui run e2e
      - name: Core must bundle for browsers (no Node-only APIs)
        run: pnpm build:browser-check
      - name: Vectors are deterministic and up to date
        run: pnpm vectors:check
      - name: Trusted timestamp roots are current and not expiring
        if: runner.os == 'Linux'
        run: pnpm --filter @tap/anchor roots --check
      - name: Performance budgets
        run: pnpm bench --assert
      - name: Short fuzz run
        run: pnpm fuzz --seconds 30

  vscode:
    name: VS Code integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integration tests in a real VS Code (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter tap-cc-one test:integration
      - name: Integration tests in a real VS Code
        if: runner.os != 'Linux'
        run: pnpm --filter tap-cc-one test:integration
      - name: Package the extension
        if: runner.os == 'Linux'
        run: pnpm --filter tap-cc-one run package
      - name: Upload the VSIX
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: tap-cc-one-vsix
          path: packages/extension/*.vsix
